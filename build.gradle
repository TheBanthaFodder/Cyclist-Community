plugins {
    id 'java'
    id 'application'
}

group = 'consensus'
version = '1.0'

repositories {
    mavenCentral()
}


sourceCompatibility = '18'
targetCompatibility = '18'

task runApp(type: JavaExec) {
    group = 'application'
    description = 'Run the Application'
    mainClass = 'LaunchApp'
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
}